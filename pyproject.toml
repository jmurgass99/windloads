[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windloads"
version = "1.2.1"
description = "Wind loads on buildings and structures in Python: EN 1991-1-4 peak velocity pressure, Annex A.3 orography, Annex B structural factor CsCd, wall and roof pressure coefficients (Tables 7.1-7.4) and story forces with reference heights and lack of correlation; ASCE 7 velocity pressure, topographic factor, MWFRS directional story forces, the four torsional load cases and components and cladding GCp; NSR-10 B.6 with the ASCE 7-05 procedure; Davenport gust factor, EN 1991-1-4 Annex E vortex shedding and galloping checks; export to JSON, CSV, SAP2000 and ETABS text, a canonical model, DXF plans and an OpenFOAM pre-processor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["loadpath", "wind-loads", "wind-engineering", "en-1991-1-4", "eurocode-1", "asce-7", "nsr-10", "pressure-coefficients", "orography", "topographic-factor", "gust-factor", "vortex-shedding", "galloping", "components-and-cladding", "structural-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "pydantic>=2.0"]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.25"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0", "pytest-timeout>=2.1"]
ui = ["streamlit>=1.30"]
memos = ["handcalcs>=1.6"]
dxf = ["ezdxf>=1.0"]

[project.urls]
Homepage = "https://github.com/jmurgass99/windloads"
Repository = "https://github.com/jmurgass99/windloads"
Issues = "https://github.com/jmurgass99/windloads/issues"

[tool.setuptools.packages.find]
include = ["windloads*"]

[tool.setuptools.package-data]
windloads = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "property: property-based con hypothesis",
]
